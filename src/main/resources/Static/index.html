<!DOCTYPE html>
<html>
<head>
    <title>Save Customer</title>
</head>
<body>

<h2>Customer Form</h2>

<input type="hidden" id="customer_id" value="0">

<input type="number" id="customerFamilyId" placeholder="Customer Family ID"><br><br>
<input type="text" id="name" placeholder="Name"><br><br>
<input type="text" id="phone" placeholder="Phone"><br><br>
<input type="email" id="email" placeholder="Email"><br><br>
<input type="text" id="address" placeholder="Address"><br><br>
<input type="text" id="id_proof" placeholder="ID Proof"><br><br>

<button onclick="saveCustomer()">Save Customer</button>

<script>
    function saveCustomer() {

        const customer = {
            customer_id: Number(document.getElementById("customer_id").value),
            customerFamilyId: Number(document.getElementById("customerFamilyId").value),
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value,
            address: document.getElementById("address").value,
            id_proof: document.getElementById("id_proof").value
        };

        // API EXPECTS LIST
        const requestBody = [customer];

        fetch("http://localhost:8081/auth/saveCustomer", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestBody)
        })
        .then(response => response.json())
        .then(data => {
            alert("Customer saved successfully!");
            console.log("Response:", data);
        })
        .catch(error => {
            console.error("Error:", error);
            alert("Failed to save customer");
        });
    }
</script>

</body>
</html>
